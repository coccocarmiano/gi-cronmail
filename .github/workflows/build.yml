name: Test + Build

on:
  push:
    branches:
      - prod

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: go test ./... -v

  build:
    runs-on: ubuntu-latest
    container: golang:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build project
        run: go build -buildvcs=false
